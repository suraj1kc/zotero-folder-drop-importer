name: Bug report
description: Report a reproducible problem with importing folders
labels: [bug]
body:
  - type: input
    id: zotero
    attributes:
      label: Zotero version
      placeholder: 10.0.x
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS / Ubuntu
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source folder type
      options:
        - Local disk
        - OneDrive
        - Dropbox
        - Network drive
        - Other cloud/sync folder
        - Other
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Import method
      options:
        - Right-click Import Folder Here
        - File menu (Import Folder)
        - Drag and drop
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Minimal folder tree
      render: text
      placeholder: |
        Research/
        ├── A/paper1.pdf
        └── B/paper2.pdf
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Import summary shown by the plugin
      description: The full text of the final progress panel, including any "Ignored", "unreadable" or "read partially" lines.
      placeholder: "Folder Drop Importer complete / Found: 40 - Imported: 34 ..."
  - type: textarea
    id: logs
    attributes:
      label: Debug output
      description: Enable Help -> Debug Output Logging -> View Output, run the import, then paste the lines containing "Zotero Folder Drop Importer". This is more useful than the Error Console for import problems.
      render: text
