name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: npm run check
      - name: Import engine tests
        run: npm test
      - name: Build XPI
        run: npm run build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.xpi
          generate_release_notes: true
