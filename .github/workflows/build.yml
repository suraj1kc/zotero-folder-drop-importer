name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check
        run: npm run check
      - name: Import engine tests
        run: npm test
      - name: Build XPI
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-folder-drop-importer-xpi
          path: dist/*.xpi
